name: Build React WebApp

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../webapp-dist.zip .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: webapp-dist.zip
          retention-days: 30
