name: Build WebApp and LittleFS

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------
      # Repository laden
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Node.js einrichten
      # ---------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------------------
      # React-/Vite-App bauen
      # ---------------------------------------------------

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      # ---------------------------------------------------
      # Normalen dist-Ordner bereitstellen
      # ---------------------------------------------------

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

      # ---------------------------------------------------
      # Python und PlatformIO installieren
      # ---------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio

      # ---------------------------------------------------
      # Temporäres PlatformIO-Projekt vorbereiten
      # ---------------------------------------------------

      - name: Prepare LittleFS build directory
        shell: bash
        run: |
          mkdir -p littlefs-build/data
          mkdir -p littlefs-build/src

          cp -R dist/. littlefs-build/data/

          cat > littlefs-build/src/main.cpp <<'EOF'
          #include <Arduino.h>

          void setup()
          {
          }

          void loop()
          {
          }
          EOF

          cat > littlefs-build/platformio.ini <<'EOF'
          [env:seeed_xiao_esp32c6]
          platform = https://github.com/Seeed-Studio/platform-seeedboards.git
          board = seeed-xiao-esp32-c6
          framework = arduino

          board_build.filesystem = littlefs

          platform_packages =
              platformio/tool-mklittlefs@1.203.210628
          EOF

      # ---------------------------------------------------
      # Erzeugte Konfiguration kontrollieren
      # ---------------------------------------------------

      - name: Show generated PlatformIO configuration
        shell: bash
        run: |
          echo "Generierte platformio.ini:"
          echo "----------------------------------------"
          cat littlefs-build/platformio.ini
          echo "----------------------------------------"

      # ---------------------------------------------------
      # LittleFS-Inhalt kontrollieren
      # ---------------------------------------------------

      - name: Show LittleFS files
        shell: bash
        run: |
          echo "Folgende Dateien werden in LittleFS gepackt:"
          find littlefs-build/data -type f -printf "%p  %s Bytes\n"

          echo
          echo "Gesamtgröße der Vite-Dateien:"
          du -sh littlefs-build/data

          if [ ! -f littlefs-build/data/index.html ]; then
            echo "FEHLER: dist/index.html wurde nicht gefunden."
            exit 1
          fi

      # ---------------------------------------------------
      # LittleFS-Tool vorab installieren
      # ---------------------------------------------------

      - name: Install mklittlefs
        working-directory: littlefs-build
        run: |
          pio pkg install \
            --tool "platformio/tool-mklittlefs@1.203.210628"

      # ---------------------------------------------------
      # Installierte Pakete kontrollieren
      # ---------------------------------------------------

      - name: Show installed PlatformIO packages
        working-directory: littlefs-build
        run: pio pkg list

      # ---------------------------------------------------
      # LittleFS-Abbild bauen
      # ---------------------------------------------------

      - name: Build LittleFS image
        working-directory: littlefs-build
        run: pio run --target buildfs

      # ---------------------------------------------------
      # Ergebnis überprüfen und umbenennen
      # ---------------------------------------------------

      - name: Prepare LittleFS artifact
        shell: bash
        run: |
          SOURCE_FILE="littlefs-build/.pio/build/seeed_xiao_esp32c6/littlefs.bin"
          TARGET_FILE="CAM-System-littlefs.bin"

          if [ ! -f "$SOURCE_FILE" ]; then
            echo "FEHLER: LittleFS-Abbild wurde nicht gefunden."
            echo "Gesuchte Datei: $SOURCE_FILE"
            echo
            echo "Vorhandene BIN-Dateien:"
            find littlefs-build -type f -name "*.bin" -print
            exit 1
          fi

          cp "$SOURCE_FILE" "$TARGET_FILE"

          echo "LittleFS-Abbild erfolgreich erstellt:"
          ls -lh "$TARGET_FILE"

      # ---------------------------------------------------
      # LittleFS-BIN bereitstellen
      # ---------------------------------------------------

      - name: Upload LittleFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAM-System-LittleFS
          path: CAM-System-littlefs.bin
          retention-days: 30
          if-no-files-found: error
